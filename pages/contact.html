<div class="wrap">
  <div class="breadcrumb"><a href="/">Accueil</a> / Contact</div>
  <div class="static-wrap" style="margin-left:0">
    <h1>Contact</h1>
    <p class="static-lead">Une question, un signalement d'erreur, un droit de réponse, une proposition d'article ? Écrivez-nous.</p>
    <div class="static-grid">
      <div class="static-card"><strong>Rédaction</strong><span>redaction@hnetmedia.com</span></div>
      <div class="static-card"><strong>Publicité &amp; partenariats</strong><span>partenariats@hnetmedia.com</span></div>
    </div>
    <h2>Formulaire de contact</h2>
    <form class="contact-form" id="contactForm">
      <input type="text" name="name" placeholder="Votre nom" required>
      <input type="email" name="email" placeholder="Votre adresse email" required>
      <select name="category" required>
        <option value="" disabled selected>Type de demande</option>
        <option>Rédaction</option>
        <option>Correction</option>
        <option>Droit de réponse</option>
        <option>Publicité</option>
        <option>Partenariat</option>
        <option>Recrutement</option>
        <option>Autre</option>
      </select>
      <input type="text" name="subject" placeholder="Sujet">
      <textarea name="message" placeholder="Votre message" required></textarea>
      <button type="submit">Envoyer le message</button>
    </form>
    <div id="contactMsg" class="dev-notice" hidden></div>
  </div>
</div>
