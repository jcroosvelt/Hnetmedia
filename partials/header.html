<!--TICKER-->
<div class="ticker">
  <div class="ticker-badge">
    <div class="live-dot"></div>
    {{URGENT}}
  </div>
  <div class="ticker-rail">
    <div class="ticker-tape" id="tickerTape">
      <!--TICKER_ITEMS-->
    </div>
  </div>
</div>
<!--/TICKER-->

<header class="site-header">
  <div class="header-top">
    <!-- LOGO -->
    <a href="/" class="logo-link">
      <img class="logo-img" src="/assets/logo.png" alt="HNet Media" width="280" height="60" loading="eager">
    </a>

    <!-- DATE -->
    <div class="header-center">
      <span class="date-line" id="currentDate"></span>
    </div>

    <!-- ACTIONS -->
    <div class="header-right">
      <form class="search-box" action="/recherche" method="get" role="search">
        <input class="search-field" type="text" name="q" placeholder="{{Rechercher…}}" aria-label="{{Rechercher}}" id="searchInput" autocomplete="off">
        <button class="search-icon" type="submit" aria-label="{{Rechercher}}">🔍</button>
      </form>
      <!--LANGSW-->
      <!-- Bouton « S'abonner » retiré tant que la newsletter n'est pas active (aucune fonction présentée comme active si elle ne l'est pas) -->
    </div>
  </div>

  <!-- NAV -->
  <nav aria-label="{{Rubriques}}">
    <div class="nav-inner">
      <!--NAV-->
    </div>
  </nav>
</header>
